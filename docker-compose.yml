# Local stack: PostgreSQL, the migrations, the API, the dashboard and Keycloak as a test identity provider.
#   docker compose up --build -d     → dashboard on http://localhost:8080 (the API is behind it under /api)
#                                      sign in as a.kowalska (Admin), m.chen (Editor) or j.novak (Viewer), password "shipscope"
#   docker compose up -d keycloak    # only the identity provider, for `npm run start:dev` (http://localhost:8180)
#   docker compose up -d db          # only the database, for `npm run start:dev` and the backend tests
#   docker compose down              # keeps the data volume; add -v to delete it
# Values come from ./.env when it exists (see .env.example); the defaults below are for local use only.

name: shipscope-flags

x-database-url: &database-url postgres://${POSTGRES_USER:-shipscope}:${POSTGRES_PASSWORD:-shipscope}@db:5432/${POSTGRES_DB:-shipscope_flags}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipscope}
      POSTGRES_DB: ${POSTGRES_DB:-shipscope_flags}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates the test database (TEST_DATABASE_URL) next to the main one when the volume is first initialised.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Published on localhost only, for local tools (psql, the API and tests run from the host).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies the Prisma migrations, then loads the demo data into an empty database (SEED_DEMO_DATA).
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: *database-url
      # Services read flags with their own credential (dashboard → Services); SDK_TOKEN is the deprecated shared one.
      SDK_TOKEN: ${SDK_TOKEN:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_HOSTS: ${NOTIFY_WEBHOOK_HOSTS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      RATE_LIMIT_SDK_PER_MINUTE: ${RATE_LIMIT_SDK_PER_MINUTE:-}
      # Requests reach the API through nginx (web) on the private compose network: trust its X-Forwarded-For, so
      # rate limits count each client, not nginx.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      # Sign-in through the local Keycloak below. The browser reaches it at localhost:8180, the API at keycloak:8080;
      # Keycloak names localhost:8180 as the issuer either way (KC_HOSTNAME). Replace all of these for a real provider.
      APP_URL: http://localhost:${WEB_PORT:-8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/shipscope}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/shipscope/.well-known/openid-configuration}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-true}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-shipscope-flags}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-shipscope-dev-secret}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-}
      OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
      OIDC_EDITOR_ROLES: ${OIDC_EDITOR_ROLES:-}
      OIDC_VIEWER_ROLES: ${OIDC_VIEWER_ROLES:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Test identity provider (development mode, data kept in the container only): realm "shipscope" from
  # docker/keycloak/shipscope-realm.json with the client and three users, one per role. Never expose it as is.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      # The API reaches Keycloak at keycloak:8080: token and key endpoints then name that address, the issuer stays.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Admin console at http://localhost:8180/admin (realm "master").
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # The image has no curl: ask the management port for readiness over bash's /dev/tcp.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  pg-data:
