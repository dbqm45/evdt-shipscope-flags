name: CI

# Runs on every PR and, through workflow_call, as the verify step of the Release workflow on main (release.yml):
# a push to main is tested there, on the exact commit that gets tagged, so it is not run twice.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the release commit on main)
        type: string
        required: true

permissions:
  contents: read

# A newer push to the same PR cancels the run still going for the older one. Title edits have their own group, so
# an edit never cancels the tests of a push.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && 'title' || 'code') || inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    # PRs are squash-merged, so the title becomes the commit on main and decides the next version (RELEASING.md).
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.title)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The title goes through an environment variable, never into the script text.
      - run: node scripts/check-commit-message.mjs "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}

  backend:
    name: Backend (lint, typecheck, test, build)
    # An edit of the PR description or title alone does not re-run the tests.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check formatting (whole repo)
        run: npm run format:check
      - name: Check src/flags/shared is in sync with the frontend
        run: |
          npm run sync:shared
          git diff --exit-code -- src/flags/shared || {
            echo "::error::src/flags/shared is out of date. Run 'npm run sync:shared' and commit the result."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Release tooling tests
        run: npm run test:scripts
      - run: npm run build
      # actionlint over .github/workflows: a release binary checked against a pinned SHA-256.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  frontend:
    name: Frontend (lint, test, typecheck, build)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Typecheck and build
        run: npm run build

  audit:
    name: Dependency audit
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Blocking: high/critical advisories in what ships to production.
      - name: Audit runtime dependencies (backend)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit runtime dependencies (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # Informational: dev tooling (Nest CLI, Vite, linters) is reported but does not fail the build.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: |
          status=0
          npm audit --audit-level=high || status=1
          (cd frontend && npm audit --audit-level=high) || status=1
          exit $status
