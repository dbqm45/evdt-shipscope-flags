name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check formatting (whole repo)
        run: npm run format:check
      - name: Check src/flags/shared is in sync with the frontend
        run: |
          npm run sync:shared
          git diff --exit-code -- src/flags/shared || {
            echo "::error::src/flags/shared is out of date. Run 'npm run sync:shared' and commit the result."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Typecheck and build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Blocking: high/critical advisories in what ships to production.
      - name: Audit runtime dependencies (backend)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit runtime dependencies (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # Informational: dev tooling (Nest CLI, Vite, linters) is reported but does not fail the build.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: |
          status=0
          npm audit --audit-level=high || status=1
          (cd frontend && npm audit --audit-level=high) || status=1
          exit $status
