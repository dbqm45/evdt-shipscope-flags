# Keeps the actions in .github/workflows/ and the npm dependencies of the workspace up to date, once a month,
# grouped into one PR per ecosystem. The actions are pinned to a commit SHA with the version in a
# comment: Dependabot reads that comment and bumps SHA and comment together.
# Commit prefixes follow Conventional Commits (the CI checks PR titles, RELEASING.md): runtime dependency updates are
# "fix(deps)" and so produce a patch release; dev tooling and actions ("build(deps-dev)", "ci(deps)") release nothing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 2

  # One npm workspace (API, dashboard, @shipscope/shared) with one lockfile, so one entry covers all of it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The Nest CLI builds through the TypeScript compiler API, which TypeScript 7.0 does not ship (expected back in
      # 7.1); the API and @shipscope/shared stay on 6, the dashboard (only `tsc`) is on 7 already.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope
    open-pull-requests-limit: 2
