# Security headers for the dashboard (the API sets its own through helmet). Included in every location that serves
# the build, because add_header in a location replaces the ones from the server block.
# The build loads only its own script and stylesheet; React sets styles through the DOM, which CSP does not block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# No HSTS here: nginx serves plain http inside the stack; set it where TLS ends.
