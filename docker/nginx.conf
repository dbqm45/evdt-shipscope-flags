# Dashboard: static files from the Vite build, with client-side routes (/audit-log, /settings) falling back to
# index.html. /api goes to the API container, the same way the Vite dev server proxies it.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # The address nginx sees, never one the client claims: the API keys rate limits (break-glass attempts too) and
    # audit notes on it. Behind another proxy, use the real_ip module there rather than passing the header on.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached for good; index.html must not be, so a new release is picked up.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
